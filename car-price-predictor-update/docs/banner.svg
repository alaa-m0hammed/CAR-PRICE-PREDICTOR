<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Car Price Estimator</title>
  <desc id="d">Banner with the project name. A car drives along a road while example price estimates cycle in a pill.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .road { stroke: #6b6b72; stroke-width: 4; stroke-dasharray: 44 36; animation: road 0.7s linear infinite; }
    @keyframes road { to { stroke-dashoffset: 80; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bob { animation: bob 0.45s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    .speed { opacity: 0; animation: speed 0.9s linear infinite; }
    .s2 { animation-delay: 0.3s; }
    .s3 { animation-delay: 0.6s; }
    @keyframes speed {
      0% { opacity: 0; transform: translateX(30px); }
      30% { opacity: 0.8; }
      100% { opacity: 0; transform: translateX(-30px); }
    }
    .p { opacity: 0; animation: cycle 9s infinite both; }
    .p2 { animation-delay: 3s; }
    .p3 { animation-delay: 6s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      4% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      34% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .p1 { opacity: 1; }
    }
  </style>

  <rect width="1200" height="300" rx="20" fill="#0e0e10"/>
  <rect x="0" y="196" width="1200" height="104" fill="#131316"/>
  <rect x="0" y="196" width="1200" height="3" fill="#2a2a2e"/>
  <line class="road" x1="0" y1="226" x2="1200" y2="226"/>

  <text x="60" y="68" font-size="14" font-weight="700" letter-spacing="3" fill="#e05a5a">USED-CAR PRICE PREDICTION</text>
  <text x="60" y="130" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Car Price Estimator</text>
  <text x="60" y="166" font-size="20" fill="#b4b4ba">Linear regression, scikit-learn and Flask</text>

  <rect x="60" y="206" width="580" height="52" rx="26" fill="#1a1a1d" stroke="#34343a" stroke-width="1.5"/>
  <circle cx="86" cy="232" r="5" fill="#9b1c1c"/>

  <g class="p p1">
    <text x="104" y="238" font-size="16" fill="#b4b4ba">Maruti Suzuki Swift, 2015, 40,000 km, Petrol</text>
    <text x="620" y="239" font-size="22" font-weight="800" fill="#ffffff" text-anchor="end">328,225</text>
  </g>
  <g class="p p2">
    <text x="104" y="238" font-size="16" fill="#b4b4ba">Hyundai Grand i10, 2014, 45,000 km, Petrol</text>
    <text x="620" y="239" font-size="22" font-weight="800" fill="#ffffff" text-anchor="end">319,478</text>
  </g>
  <g class="p p3">
    <text x="104" y="238" font-size="16" fill="#b4b4ba">Honda City, 2016, 30,000 km, Petrol</text>
    <text x="620" y="239" font-size="22" font-weight="800" fill="#ffffff" text-anchor="end">571,355</text>
  </g>

  <g transform="translate(790 96)">
    <g class="speed" stroke="#6b6b72" stroke-width="3" stroke-linecap="round">
      <line x1="-52" y1="40" x2="-22" y2="40"/>
    </g>
    <g class="speed s2" stroke="#6b6b72" stroke-width="3" stroke-linecap="round">
      <line x1="-64" y1="56" x2="-26" y2="56"/>
    </g>
    <g class="speed s3" stroke="#6b6b72" stroke-width="3" stroke-linecap="round">
      <line x1="-46" y1="70" x2="-18" y2="70"/>
    </g>
    <g class="bob">
      <path d="M8 76 L8 60 Q8 52 18 50 L66 42 L102 16 Q108 10 118 10 L226 10 Q240 10 250 18 L284 44 L330 50 Q350 54 350 66 L350 76 Z" fill="#1a1a1d" stroke="#f2f2f3" stroke-width="3" stroke-linejoin="round"/>
      <path d="M118 18 L106 40 L168 40 L168 18 Z" fill="#2a2a30" stroke="#f2f2f3" stroke-width="2" stroke-linejoin="round"/>
      <path d="M178 18 L178 40 L258 40 L234 18 Z" fill="#2a2a30" stroke="#f2f2f3" stroke-width="2" stroke-linejoin="round"/>
      <rect x="338" y="56" width="12" height="7" rx="2" fill="#e05a5a"/>
      <rect x="8" y="56" width="7" height="9" rx="2" fill="#9b1c1c"/>
      <g transform="translate(82 76)">
        <circle r="21" fill="#0e0e10" stroke="#f2f2f3" stroke-width="3"/>
        <circle r="10" fill="#26262b"/>
        <g class="spin" stroke="#f2f2f3" stroke-width="2" stroke-linecap="round">
          <path d="M-9 0 L9 0 M0 -9 L0 9 M-6.4 -6.4 L6.4 6.4 M-6.4 6.4 L6.4 -6.4"/>
        </g>
      </g>
      <g transform="translate(276 76)">
        <circle r="21" fill="#0e0e10" stroke="#f2f2f3" stroke-width="3"/>
        <circle r="10" fill="#26262b"/>
        <g class="spin" stroke="#f2f2f3" stroke-width="2" stroke-linecap="round">
          <path d="M-9 0 L9 0 M0 -9 L0 9 M-6.4 -6.4 L6.4 6.4 M-6.4 6.4 L6.4 -6.4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
