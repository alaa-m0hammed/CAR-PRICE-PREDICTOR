<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Cleaning results and model accuracy</title>
  <desc id="d">Left: number of rows kept after each cleaning step, from 892 to 716. Right: R-squared before and after the fixes. The earlier reported 0.75 was the best of 1000 random splits, the honest estimate for the original model was 0.47, and the fixed model scores 0.56 on held-out data and 0.64 with cross-validation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 9s ease-out infinite both; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 0.12s; }
    .b3 { animation-delay: 0.24s; }
    .b4 { animation-delay: 0.36s; }
    .b5 { animation-delay: 0.48s; }
    .b6 { animation-delay: 0.6s; }
    @keyframes grow {
      0% { transform: scaleX(0); }
      12% { transform: scaleX(1); }
      92% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="470" rx="20" fill="#0e0e10"/>
  <line x1="600" y1="40" x2="600" y2="430" stroke="#26262b" stroke-width="2"/>

  <text x="40" y="56" font-size="20" font-weight="700" fill="#ffffff">Rows kept after each cleaning step</text>

  <text x="40" y="104" font-size="14" fill="#b4b4ba">Raw data</text>
  <rect class="bar b1" x="40" y="112" width="440" height="16" rx="8" fill="#6b6b72"/>
  <text x="496" y="125" font-size="15" font-weight="700" fill="#ffffff">892</text>

  <text x="40" y="160" font-size="14" fill="#b4b4ba">Valid year</text>
  <rect class="bar b2" x="40" y="168" width="415" height="16" rx="8" fill="#6b6b72"/>
  <text x="471" y="181" font-size="15" font-weight="700" fill="#ffffff">842</text>

  <text x="40" y="216" font-size="14" fill="#b4b4ba">Has a price</text>
  <rect class="bar b3" x="40" y="224" width="404" height="16" rx="8" fill="#6b6b72"/>
  <text x="460" y="237" font-size="15" font-weight="700" fill="#ffffff">819</text>

  <text x="40" y="272" font-size="14" fill="#b4b4ba">No missing kilometers or fuel type</text>
  <rect class="bar b4" x="40" y="280" width="402" height="16" rx="8" fill="#6b6b72"/>
  <text x="458" y="293" font-size="15" font-weight="700" fill="#ffffff">816</text>

  <text x="40" y="328" font-size="14" fill="#b4b4ba">No duplicate listings</text>
  <rect class="bar b5" x="40" y="336" width="357" height="16" rx="8" fill="#9b1c1c"/>
  <text x="413" y="349" font-size="15" font-weight="700" fill="#ffffff">724</text>

  <text x="40" y="384" font-size="14" fill="#b4b4ba">No impossible values (outliers)</text>
  <rect class="bar b6" x="40" y="392" width="353" height="16" rx="8" fill="#e05a5a"/>
  <text x="409" y="405" font-size="15" font-weight="700" fill="#ffffff">716</text>

  <text x="640" y="56" font-size="20" font-weight="700" fill="#ffffff">R2 score, higher is better</text>

  <text x="640" y="104" font-size="14" fill="#b4b4ba">Reported earlier (best of 1000 random splits)</text>
  <rect class="bar b1" x="640" y="112" width="400" height="16" rx="8" fill="none" stroke="#6b6b72" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1056" y="125" font-size="15" font-weight="700" fill="#b4b4ba">0.75</text>

  <text x="640" y="184" font-size="14" fill="#b4b4ba">Original model, honest estimate</text>
  <rect class="bar b2" x="640" y="192" width="251" height="16" rx="8" fill="#6b6b72"/>
  <text x="907" y="205" font-size="15" font-weight="700" fill="#ffffff">0.47</text>

  <text x="640" y="264" font-size="14" fill="#b4b4ba">Fixed model, held-out test set</text>
  <rect class="bar b3" x="640" y="272" width="299" height="16" rx="8" fill="#9b1c1c"/>
  <text x="955" y="285" font-size="15" font-weight="700" fill="#ffffff">0.56</text>

  <text x="640" y="344" font-size="14" fill="#b4b4ba">Fixed model, 5x5 cross-validation</text>
  <rect class="bar b4" x="640" y="352" width="341" height="16" rx="8" fill="#e05a5a"/>
  <text x="997" y="365" font-size="15" font-weight="700" fill="#ffffff">0.64</text>

  <text x="640" y="410" font-size="13" fill="#8a8a92">Dashed bar: score picked on the test data itself, not a real estimate.</text>
</svg>
